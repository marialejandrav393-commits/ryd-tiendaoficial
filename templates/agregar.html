<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RyD - Agregar Nuevo Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ryd-gold: #C5A059;
            --ryd-gold-dark: #9D7B38;
            --ryd-bg: #F8F5F0;
            --ryd-surface: #FFFFFF;
            --ryd-beige-card: #F2ECE1;
            --ryd-border: #E8DEC8;
            --ryd-text: #2C2620;
            --ryd-muted: #827668;
            --emboss-shadow: 4px 4px 10px rgba(180, 165, 140, 0.3), -4px -4px 10px rgba(255, 255, 255, 0.95);
            --emboss-btn: 3px 3px 7px rgba(180, 165, 140, 0.28), -3px -3px 7px rgba(255, 255, 255, 0.9);
            --emboss-active: inset 2px 2px 5px rgba(180, 165, 140, 0.3), inset -2px -2px 5px rgba(255, 255, 255, 0.85);
        }

        body {
            background-color: var(--ryd-bg);
            color: var(--ryd-text);
            font-family: 'Cinzel', 'Segoe UI', serif;
            margin: 0;
            padding: 0;
        }

        .header-ryd {
            background: var(--ryd-surface);
            border-bottom: 1.5px solid var(--ryd-border);
            padding: 16px 36px;
        }

        .logo-ryd {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--ryd-gold);
            letter-spacing: 3px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .card-form-luxury {
            background: var(--ryd-surface);
            border: 1px solid var(--ryd-border);
            border-radius: 14px;
            box-shadow: var(--emboss-shadow);
            padding: 30px;
            max-width: 680px;
            margin: 30px auto;
        }

        .input-luxury {
            background: #FAF7F2;
            border: 1px solid var(--ryd-border);
            border-radius: 8px;
            color: var(--ryd-text);
            padding: 10px 14px;
            font-size: 0.9rem;
            width: 100%;
            box-shadow: inset 1px 1px 3px rgba(180, 165, 140, 0.15);
        }
        .input-luxury:focus {
            background: #FFFFFF;
            border-color: var(--ryd-gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.2);
        }

        .btn-3d {
            background: var(--ryd-surface);
            border: 1px solid var(--ryd-border);
            color: var(--ryd-text);
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: var(--emboss-btn);
            transition: all 0.18s ease;
            text-decoration: none;
        }
        .btn-3d:hover {
            border-color: var(--ryd-gold);
            color: var(--ryd-gold-dark);
        }

        .btn-3d-gold {
            background: linear-gradient(135deg, #DFCA98, #B89248);
            border: 1px solid #C5A059;
            color: #FFFFFF;
        }
        .btn-3d-gold:hover {
            background: linear-gradient(135deg, #D4B26F, #A6823C);
            color: #FFFFFF;
        }
    </style>
</head>
<body>

<header class="header-ryd d-flex justify-content-between align-items-center">
    <a href="/admin" class="logo-ryd">RyD</a>
    <a href="/admin" class="btn-3d">Volver al Panel</a>
</header>

<div class="container my-4">
    <div class="card-form-luxury">
        <h5 class="fw-bold mb-3" style="letter-spacing: 1.2px; text-transform: uppercase; font-size: 1.1rem; border-bottom: 1px solid var(--ryd-border); padding-bottom: 10px;">
            Registrar Nuevo Producto
        </h5>

        <form action="/agregar" method="POST">
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="small text-muted fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase;">Código SKU *</label>
                    <input type="text" name="codigo" class="input-luxury" placeholder="Ej: UÑA-100" required autofocus>
                </div>
                <div class="col-md-8">
                    <label class="small text-muted fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase;">Nombre del Producto *</label>
                    <input type="text" name="nombre" class="input-luxury" placeholder="Ej: Esmalte Semipermanente Nude" required>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="small text-muted fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase;">Categoría</label>
                    <select name="categoria" class="input-luxury">
                        <option value="Uñas">Uñas</option>
                        <option value="Aparatología">Aparatología</option>
                        <option value="Cejas y Pestañas">Cejas y Pestañas</option>
                        <option value="Insumos">Insumos</option>
                        <option value="Desechables">Desechables</option>
                        <option value="Cabello">Cabello</option>
                        <option value="Íntimo">Íntimo</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="small text-muted fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase;">Stock Inicial</label>
                    <input type="number" name="stock" class="input-luxury" value="1" min="0" required>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="small text-muted fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase;">Costo de Compra ($)</label>
                    <input type="number" step="0.01" id="costoIn" name="costo" class="input-luxury" value="1.00" oninput="calcularPvpAutomatico()">
                </div>
                <div class="col-md-4">
                    <label class="small text-muted fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase;">Margen Ganancia %</label>
                    <input type="number" step="1" id="margenIn" class="input-luxury" value="30" oninput="calcularPvpAutomatico()">
                </div>
                <div class="col-md-4">
                    <label class="small text-muted fw-bold mb-1" style="font-size: 0.72rem; text-transform: uppercase;">Precio de Venta ($) *</label>
                    <input type="number" step="0.01" id="precioIn" name="precio" class="input-luxury" style="font-weight: 700; color: var(--ryd-gold-dark);" value="1.30" required>
                </div>
            </div>

            <input type="hidden" name="descuento" value="0">

            <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                <a href="/admin" class="btn-3d">Cancelar</a>
                <button type="submit" class="btn-3d btn-3d-gold">Guardar en Inventario</button>
            </div>
        </form>
    </div>
</div>

<script>
function calcularPvpAutomatico() {
    const c = parseFloat(document.getElementById('costoIn').value) || 0;
    const m = parseFloat(document.getElementById('margenIn').value) || 0;
    const p = c * (1 + (m / 100));
    document.getElementById('precioIn').value = p.toFixed(2);
}
</script>
</body>
</html>
