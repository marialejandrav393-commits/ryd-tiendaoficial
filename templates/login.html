<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RyD - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #FDFBF7;
            color: #2b2b2b;
            font-family: 'Apple Garamond', Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header-ryd {
            background-color: #FFFFFF;
            border-bottom: 1px solid #F0EAE1;
            padding: 20px 40px;
        }
        .logo-ryd {
            font-size: 2.5rem;
            font-weight: bold;
            color: #C5A059;
            letter-spacing: 2px;
            text-decoration: none;
        }
        .card-login {
            background-color: #FFFFFF;
            border: 1px solid #E5E0D8;
            border-radius: 4px;
            max-width: 400px;
            width: 100%;
            margin: auto;
            padding: 30px;
        }
        .btn-ryd {
            background-color: #2b2b2b;
            color: #FFFFFF;
            border: none;
        }
        .btn-ryd:hover {
            background-color: #C5A059;
            color: #FFFFFF;
        }
    </style>
</head>
<body>

<header class="header-ryd d-flex justify-content-between align-items-center">
    <a href="{{ url_for('index') }}" class="logo-ryd">RyD</a>
    <a href="{{ url_for('index') }}" class="btn btn-outline-dark btn-sm">Ver Catálogo</a>
</header>

<div class="container d-flex align-items-center justify-content-center flex-grow-1 my-5">
    <div class="card-login shadow-sm">
        <h4 class="text-center mb-4" style="color: #333;">Acceso al Sistema</h4>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger py-2 small rounded-0" role="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label small text-muted">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Ej. admin o cajero1" required autofocus>
            </div>
            
            <div class="mb-4">
                <label class="form-label small text-muted">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-ryd w-100 py-2">Ingresar</button>
        </form>
    </div>
</div>

</body>
</html>
