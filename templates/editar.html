<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RyD - Modificar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ryd-gold: #C5A059;
            --ryd-gold-dark: #9D7B38;
            --ryd-bg: #F8F5F0;
            --ryd-surface: #FFFFFF;
            --ryd-beige-card: #F2ECE1;
            --ryd-border: #E8DEC8;
            --ryd-text: #2C2620;
            --emboss-shadow: 4px 4px 10px rgba(180, 165, 140, 0.3), -4px -4px 10px rgba(255, 255, 255, 0.95);
            --emboss-btn: 3px 3px 7px rgba(180, 165, 140, 0.28), -3px -3px 7px rgba(255, 255, 255, 0.9);
        }
        body { background-color: var(--ryd-bg); color: var(--ryd-text); font-family: 'Cinzel', serif; padding: 30px 15px; }
        .panel-luxury { background: var(--ryd-surface); border: 1px solid var(--ryd-border); border-radius: 12px; box-shadow: var(--emboss-shadow); padding: 24px; max-width: 650px; margin: 0 auto; }
        .input-luxury { background: #FAF7F2; border: 1px solid var(--ryd-border); border-radius: 8px; color: var(--ryd-text); padding: 10px 14px; font-size: 0.9rem; }
        .btn-3d { background: var(--ryd-surface); border: 1px solid var(--ryd-border); color: var(--ryd-text); font-weight: 700; padding: 10px 20px; border-radius: 8px; box-shadow: var(--emboss-btn); text-decoration: none; display: inline-block; }
        .btn-3d-gold { background: linear-gradient(135deg, #DFCA98, #B89248); border: 1px solid #C5A059; color: #FFFFFF; }
    </style>
</head>
<body>

<div class="panel-luxury">
    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
        <h5 style="margin: 0; letter-spacing: 1.5px; text-transform: uppercase;">Modificar Producto</h5>
        <a href="/admin" class="btn-3d btn-sm">Volver</a>
    </div>

    <form method="POST">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="small text-muted fw-bold mb-1">Código SKU:</label>
                <input type="text" name="codigo" class="form-control input-luxury fw-bold" value="{{ producto.codigo }}">
            </div>
            <div class="col-md-8">
                <label class="small text-muted fw-bold mb-1">Nombre del Producto:</label>
                <input type="text" name="nombre" class="form-control input-luxury" value="{{ producto.nombre }}" required>
            </div>

            <div class="col-md-4">
                <label class="small text-muted fw-bold mb-1">Costo Unitario ($):</label>
                <input type="number" step="0.01" name="costo" class="form-control input-luxury" value="{{ producto.costo }}">
            </div>
            <div class="col-md-4">
                <label class="small text-muted fw-bold mb-1" style="color: #9D7B38;">Precio Bs ($):</label>
                <input type="number" step="0.01" name="precio_bs" class="form-control input-luxury fw-bold" value="{{ producto.precio_bs }}">
            </div>
            <div class="col-md-4">
                <label class="small text-muted fw-bold mb-1">Precio Divisa ($):</label>
                <input type="number" step="0.01" name="precio" class="form-control input-luxury fw-bold" value="{{ producto.precio }}" required>
            </div>

            <div class="col-md-6">
                <label class="small text-muted fw-bold mb-1">Existencia (Stock):</label>
                <input type="number" name="stock" class="form-control input-luxury" value="{{ producto.stock }}" required>
            </div>
            <div class="col-md-6">
                <label class="small text-muted fw-bold mb-1">Categoría:</label>
                <input type="text" name="categoria" class="form-control input-luxury" value="{{ producto.categoria }}">
            </div>

            <div class="col-12 mt-4 text-end">
                <a href="/admin" class="btn-3d me-2">Cancelar</a>
                <button type="submit" class="btn-3d btn-3d-gold">Guardar Cambios</button>
            </div>
        </div>
    </form>
</div>

</body>
</html>
