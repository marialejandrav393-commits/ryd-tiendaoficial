<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Inventario</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        nav { margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        nav a { margin-right: 15px; text-decoration: none; color: #007bff; font-weight: bold; font-size: 16px; }
        h1, h2 { color: #2c3e50; }
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 25px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        input, button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .btn-danger { background: #dc3545; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .btn-danger:hover { background: #bd2130; }
        .search-box { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #343a40; color: white; }
        tr:hover { background: #f1f1f1; }
        .badge-warning { background: #ffc107; color: #212529; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">📦 Inventario</a>
            <a href="/ventas">🛒 Punto de Venta</a>
        </nav>

        <h1>Gestión de Productos</h1>

        <form action="/agregar" method="POST">
            <input type="text" name="codigo" placeholder="Código" required>
            <input type="text" name="nombre" placeholder="Nombre" required>
            <input type="number" step="0.01" name="costo" placeholder="Costo ($)" required>
            <input type="number" step="0.01" name="precio" placeholder="Precio ($)" required>
            <input type="number" name="stock" placeholder="Stock" required>
            <button type="submit">Guardar</button>
        </form>

        <h2>Lista de Inventario</h2>
        <input type="text" id="buscador" class="search-box" placeholder="🔍 Buscar producto por código o nombre..." onkeyup="filtrarProductos()">

        <table id="tabla-productos">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Costo</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                {% for p in productos %}
                <tr>
                    <td>{{ p[1] }}</td>
                    <td>{{ p[2] }}</td>
                    <td>${{ "%.2f"|format(p[3]) }}</td>
                    <td>${{ "%.2f"|format(p[4]) }}</td>
                    <td>
                        {{ p[5] }}
                        {% if p[5] <= 3 %}
                            <span class="badge-warning">¡Poco stock!</span>
                        {% endif %}
                    </td>
                    <td>
                        <a href="/eliminar/{{ p[0] }}" class="btn-danger" onclick="return confirm('¿Eliminar este producto?')">Borrar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        function filtrarProductos() {
            let input = document.getElementById("buscador").value.toLowerCase();
            let filas = document.querySelectorAll("#tabla-productos tbody tr");
            filas.forEach(fila => {
                let texto = fila.innerText.toLowerCase();
                fila.style.display = texto.includes(input) ? "" : "none";
            });
        }
    </script>
</body>
</html>
